[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpac-studio"
version = "1.0.0"
description = "Local TPAC inspection, workspace editing and verified package assembly"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
authors = [{name = "X7 Dragon"}]
dependencies = ["lz4>=4.4,<5", "Pillow>=12.3,<13", "jsonschema>=4.25,<5"]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.11,<6.12", "PyOpenGL>=3.1.10,<4", "numpy>=2.5,<3"]
mcp = ["mcp>=1.30,<2"]
dev = ["pytest>=9,<10", "ruff>=0.15", "build>=1.4", "jsonschema>=4.25,<5"]
bundle = ["pyinstaller>=6.22,<7"]

[project.scripts]
tpac-studio = "tpac_studio.cli:main"
tpac-studio-mcp = "tpac_studio.mcp_server:main"

[project.gui-scripts]
tpac-studio-gui = "tpac_studio.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tpac_studio = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
