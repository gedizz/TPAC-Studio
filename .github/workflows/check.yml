name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[gui,mcp,dev]" -c requirements-lock.txt
      - run: python -m ruff check src tests tools examples
      - run: python -m ruff format --check src tests tools examples
      - run: python -m pytest -q
      - run: python tools/generate_reference.py --check
      - run: python -m build
