[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tpac-studio-example-opacity"
version = "1.0.0"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "X7 Dragon"}]
dependencies = ["tpac-studio>=1.0,<2"]

[project.entry-points."tpac_studio.extensions"]
example-opacity = "example_opacity:ExampleOpacity"

[tool.setuptools]
py-modules = ["example_opacity"]
